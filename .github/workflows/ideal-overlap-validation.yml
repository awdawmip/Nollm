name: Nollm merged overlap task ref finalization
on:
  push:
    branches: [validation/ideal-overlap-20260910]
permissions:
  contents: read
concurrency:
  group: nollm-ideal-overlap-20260910
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Exact-ref atomic archival after verified merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          repo='awdawmip/Nollm'
          work='lab/ideal-overlap-enclosure-20260910'
          transport='validation/ideal-overlap-20260910'
          candidate='5ecb2c76003a0f209a7b46e2ec46840547f6ee60'
          merged='88d63b32329fbbcd18028de1ac83b2db3c988e33'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+transport
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def api(path):
            request=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          pr=api('/pulls/5')
          assert pr['merged'] and pr['head']['sha']==candidate and pr['merge_commit_sha']==merged
          active=set()
          for page in range(1,11):
            prs=api(f'/pulls?state=open&per_page=100&page={page}')
            for p in prs:
              if p['head']['repo'] and p['head']['repo']['full_name']==repo:active.add(p['head']['ref'])
            if len(prs)<100:break
          else:raise RuntimeError('bounded PR inventory exhausted')
          assert not active.intersection((work,transport))
          def refs():return {line.split()[1]:line.split()[0] for line in git('ls-remote','--refs','origin').splitlines()}
          before=refs()
          assert subprocess.run(['git','merge-base','--is-ancestor',candidate,merged],capture_output=True).returncode==0
          assert before.get('refs/heads/main')==merged,'Concurrent main movement: preserve all refs for review'
          assert git('rev-parse',candidate+'^{tree}')==git('rev-parse',merged+'^{tree}')
          entries=[
            ('refs/heads/'+work,candidate,'refs/tags/archive/2026-09-10/lab-ideal-overlap-enclosure'),
            ('refs/heads/'+transport,os.environ['GITHUB_SHA'],'refs/tags/archive/2026-09-10/validation-ideal-overlap'),
          ]
          leases=[];specs=[]
          for old,sha,target in entries:
            assert before.get(old) in (None,sha),'Concurrent task ref movement'
            assert before.get(target) in (None,sha),'Archive collision'
            if before.get(old) is None:
              assert before.get(target)==sha,'Original missing without retained tip'
              continue
            if before.get(target) is None:
              leases.append('--force-with-lease='+target+':')
              specs.append(sha+':'+target)
            leases.append('--force-with-lease='+old+':'+sha)
            specs.append(':'+old)
          if specs:subprocess.run(['git','push','--atomic',*leases,'origin',*specs],check=True)
          after=refs()
          for old,sha,target in entries:
            assert old not in after and after.get(target)==sha
          affected={r for old,sha,target in entries for r in (old,target)}
          assert all(after.get(r)==sha for r,sha in before.items() if r not in affected),'Unrelated concurrent ref change: inspect, do not overwrite'
          result={'merged':merged,'retained':[{'original':old,'sha':sha,'archive':target} for old,sha,target in entries],
                  'cold_branches':{r:sha for r,sha in after.items() if r.startswith('refs/heads/cold/')},
                  'final_heads':{r:sha for r,sha in after.items() if r.startswith('refs/heads/')}}
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
            f.write('# Verified overlap task finalization\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
