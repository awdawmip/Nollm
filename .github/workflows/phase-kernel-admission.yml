name: Nollm phase-kernel admission and ownership repair
on:
  push:
    branches: [validation/q40-phase-admission-20260910]
permissions:
  contents: write
concurrency:
  group: nollm-phase-admission-20260910
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ab05f172c93f0aed8871446c8b2fcf167c296e36
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements-validation.txt
      - name: Regenerate only admitted ownership outputs and publish guarded checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base='ab05f172c93f0aed8871446c8b2fcf167c296e36'
          branch='refs/heads/kernel/q40-phase-20260910'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==base
          assert git('status','--porcelain')==''
          assert Path('AGENTS.md').read_bytes()==b''
          subprocess.run(['python','tools/generate_module_ownership_manifest.py','--write'],check=True)
          allowed={
            'docs/architecture/module-ownership/MODULE_OWNERSHIP_MANIFEST.json',
            'docs/architecture/module-ownership/MODULE_OWNERSHIP_MANIFEST.csv',
            'docs/architecture/module-ownership/UNCLASSIFIED_TRACKED_FILES.txt',
          }
          changed=set(git('diff','--name-only').splitlines())
          assert changed and changed<=allowed,changed
          subprocess.run(['git','diff','--check'],check=True)
          for cmd in (
            ['python','tools/generate_module_ownership_manifest.py','--check'],
            ['python','tools/validate_module_ownership_manifest.py'],
            ['python','tools/check_active_tree_assets.py'],
          ):subprocess.run(cmd,check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','commit','-m','governance: regenerate canonical ownership for current V3.14 files'],check=True)
          head=git('rev-parse','HEAD')
          assert git('rev-parse','HEAD^')==base
          remote=git('ls-remote','--refs','origin',branch).split()[0]
          assert remote==base,'Concurrent kernel change; do not overwrite'
          subprocess.run(['git','push','--force-with-lease='+branch+':'+base,'origin','HEAD:'+branch],check=True)
          assert git('ls-remote','--refs','origin',branch).split()[0]==head
          print('EXACT_ADMISSION_CANDIDATE='+head)
          PY
      - name: Full matrix on the exact published admission candidate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path.cwd();env=os.environ.copy()
          env['PYTHONPATH']=os.pathsep.join([str(p) for p in sorted((root/'packages').glob('*/src'))]+[str(root/'reference/python'),str(root/'integrations/openclaw/formation-loop/python')])
          matrix=[
           ['python','-m','pytest','-q','packages/nollm-core/tests'],
           ['python','-m','pytest','-q','packages/nollm-snapshot/tests','packages/nollm-trace/tests'],
           ['python','-m','pytest','-q','packages/nollm-access/tests'],
           ['python','-m','pytest','-q','integrations/openclaw/formation-loop/tests'],
           ['python','-m','pytest','-q','reference/python/tests/m0'],
           ['python','tools/generate_module_ownership_manifest.py','--check'],
           ['python','tools/validate_module_ownership_manifest.py'],
           ['python','tools/check_active_tree_assets.py'],
          ]
          results=[]
          for cmd in matrix:
           print('::group::'+' '.join(cmd),flush=True)
           p=subprocess.run(cmd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
           print(p.stdout,flush=True);print('::endgroup::',flush=True)
           results.append({'command':cmd,'exit_code':p.returncode})
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
           f.write(f'# Nollm phase-kernel admission\nExact candidate: `{sha}`\n\n')
           for x in results:f.write(f"- {'PASS' if x['exit_code']==0 else 'FAIL'}: `{' '.join(x['command'])}`\n")
          print(json.dumps({'candidate':sha,'results':results},indent=2))
          sys.exit(int(any(x['exit_code'] for x in results)))
          PY
      - name: Archive this one-shot transport without merging it into product source
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess
          source='refs/heads/validation/q40-phase-admission-20260910'
          target='refs/tags/archive/2026-09-10/validation-q40-phase-admission'
          sha=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF']==source
          def refs():
           output=subprocess.check_output(['git','ls-remote','--refs','origin',source,target],text=True)
           return {line.split()[1]:line.split()[0] for line in output.splitlines()}
          current=refs()
          assert current.get(source) in (None,sha)
          assert current.get(target) in (None,sha)
          if current.get(source)==sha:
           subprocess.run(['git','fetch','--no-tags','origin',sha],check=True)
           specs=[':'+source];leases=['--force-with-lease='+source+':'+sha]
           if target not in current:
            specs.insert(0,sha+':'+target);leases.append('--force-with-lease='+target+':')
           subprocess.run(['git','push','--atomic',*leases,'origin',*specs],check=True)
          final=refs()
          assert source not in final and final.get(target)==sha
          print('Verified transport archive: '+target+' @ '+sha)
          PY
