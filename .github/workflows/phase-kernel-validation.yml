name: Nollm pinned phase-kernel validation and ref reconciliation
on:
  push:
    branches: [validation/q40-phase-20260910]
permissions:
  contents: read
concurrency:
  group: nollm-phase-20260910
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b0797b35cdd5598827f5f81860b23ceef7096c85
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements-validation.txt
      - name: Full package and repository matrix on the exact candidate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path.cwd()
          env=os.environ.copy()
          env['PYTHONPATH']=os.pathsep.join([str(p) for p in sorted((root/'packages').glob('*/src'))]+[str(root/'reference/python'),str(root/'integrations/openclaw/formation-loop/python')])
          out=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'nollm-phase-validation'
          out.mkdir(exist_ok=True)
          matrix=[
           ['python','-m','pytest','-q','packages/nollm-core/tests'],
           ['python','-m','pytest','-q','packages/nollm-snapshot/tests','packages/nollm-trace/tests'],
           ['python','-m','pytest','-q','packages/nollm-access/tests'],
           ['python','-m','pytest','-q','integrations/openclaw/formation-loop/tests'],
           ['python','-m','pytest','-q','reference/python/tests/m0'],
           ['python','tools/generate_module_ownership_manifest.py','--check'],
           ['python','tools/validate_module_ownership_manifest.py'],
           ['python','tools/check_active_tree_assets.py'],
          ]
          results=[]
          for i,cmd in enumerate(matrix):
           print('::group::'+' '.join(cmd),flush=True)
           p=subprocess.run(cmd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
           print(p.stdout,flush=True);print('::endgroup::',flush=True)
           (out/f'gate-{i}.txt').write_text(p.stdout)
           results.append({'command':cmd,'exit_code':p.returncode})
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'result.json').write_text(json.dumps({'candidate':sha,'results':results},indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
           f.write(f'# Nollm phase-kernel validation\nExact source: `{sha}`\n\n')
           for x in results:f.write(f"- {'PASS' if x['exit_code']==0 else 'FAIL'}: `{' '.join(x['command'])}`\n")
          print(json.dumps({'candidate':sha,'results':results},indent=2))
          sys.exit(int(any(x['exit_code'] for x in results)))
          PY
  reconcile:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve every tip and reconcile only the frozen branch inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          """One-shot, fixed-scope Git ref reconciliation authorized on 2026-09-10."""
          import json, os, subprocess, urllib.request
          repo='awdawmip/Nollm'
          assert os.environ['GITHUB_REPOSITORY']==repo
          included={
           'codex/aold-v313r1-direct-activation':'777ac1bd59afb733608b0ad9383874fdf1e73fc0',
           'codex/aold-v313r1-direct-activation-8182f98':'7327f88b411d92b21b7512ee3f034cf5d262ed2a',
           'codex/aold-v314-native-memory-slot':'d5c59f24ea87c161ad9a9d851aa316c834e2641c',
           'codex/aold-v314-native-memory-slot-handoff':'be4123441b38fc6280fa986785371e2d90d68eaa',
           'codex/v314-mainline-completion':'91bd14ab394e87931b45baaaa87671f30fcfd706',
           'codex/v314-mainline-integration':'91bd14ab394e87931b45baaaa87671f30fcfd706',
          }
          cold={
           'agent/global-knowledge-handshake-v1':'f63a2996d959cb923ff0117ec004919d99a53180',
           'evidence/w2-02-isolated-active-trial-20260627T1528Z':'c155c40a3d12aa90d7eceb4d4db07fd2145fa3b2',
           'evidence/w2-03-target-bound-active-trial-20260628T073600Z':'6acffdd06c807e4cae3d46a586f039606de01d0b',
           'evidence/w2-03r-main-agent-active-cutover-20260628T094800Z':'1bcf71b3499db98e05b7ebf3fa8b44aeb834389f',
          }
          def git(*args):
           return subprocess.check_output(['git',*args],text=True).strip()
          def refs():
           return {line.split()[1]:line.split()[0] for line in git('ls-remote','--refs','origin').splitlines()}
          def get_api(path):
           request=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
           })
           with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          active=set()
          for page in range(1,11):
           prs=get_api(f'/pulls?state=open&per_page=100&page={page}')
           for pr in prs:
            if pr['head']['repo'] and pr['head']['repo']['full_name']==repo:active.add(pr['head']['ref'])
           if len(prs)<100:break
          else:raise RuntimeError('PR inventory exceeded fixed pagination bound')
          assert not active.intersection(included.keys()|cold.keys()),'An old branch acquired an active PR; no refs changed'
          snapshot=refs()
          main=snapshot['refs/heads/main']
          # The validation transport is archived, never merged into product source.
          transport='validation/q40-phase-20260910'
          assert os.environ['GITHUB_REF']=='refs/heads/'+transport
          entries=[]
          for old,sha in included.items():entries.append((old,sha,'refs/tags/archive/2026-09-10/'+old,'CONTAINED'))
          for old,sha in cold.items():entries.append((old,sha,'refs/heads/cold/2026-09-10/'+old,'COLD_UNMERGED'))
          entries.append((transport,os.environ['GITHUB_SHA'],'refs/tags/archive/2026-09-10/validation-q40-phase','VALIDATION_TRANSPORT'))
          leases=[];specs=[]
          for old,sha,target,kind in entries:
           source='refs/heads/'+old
           assert old!='main' and target!=source
           current=snapshot.get(source)
           assert current in (None,sha),f'Concurrent change to {old}; no refs changed'
           assert snapshot.get(target) in (None,sha),f'Archive collision at {target}; no refs changed'
           if current is None:
            assert snapshot.get(target)==sha,f'Missing source without verified retained tip: {old}'
            continue
           if subprocess.run(['git','cat-file','-e',sha+'^{commit}'],capture_output=True).returncode:
            subprocess.run(['git','fetch','--no-tags','origin',sha],check=True)
           if kind=='CONTAINED':
            assert subprocess.run(['git','merge-base','--is-ancestor',sha,main],capture_output=True).returncode==0,f'Not contained in current main: {old}'
           if snapshot.get(target) is None:
            leases.append('--force-with-lease='+target+':')
            specs.append(sha+':'+target)
           leases.append('--force-with-lease='+source+':'+sha)
           specs.append(':'+source)
          if specs:
           # Atomic preservation+deletion, guarded by exact old heads. No force overwrite.
           subprocess.run(['git','push','--atomic',*leases,'origin',*specs],check=True)
          final=refs()
          for old,sha,target,kind in entries:
           assert 'refs/heads/'+old not in final,f'Original ref still present: {old}'
           assert final.get(target)==sha,f'Retention verification failed: {target}'
          print(json.dumps({'main_observed':main,'retained':[{'original':old,'sha':sha,'retained_ref':target,'disposition':kind} for old,sha,target,kind in entries]},indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
           f.write('# Verified branch reconciliation\n\nAll original tips preserved; atomic exact-lease ref transaction.\n\n')
           for old,sha,target,kind in entries:f.write(f'- `{old}` -> `{target}` @ `{sha}` ({kind})\n')
          PY
